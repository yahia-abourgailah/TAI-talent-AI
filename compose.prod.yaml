# Production overlay. Used with the base file, never on its own:
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# What it changes:
#   * every service runs a pinned image from the registry, never a local build, so the thing that
#     was tested is the thing that runs, and a rollback is a tag away (scripts/deploy.sh);
#   * the API listens on loopback only — TLS and the public address belong to the proxy in front;
#   * containers come back by themselves after a reboot;
#   * the database and the file store publish no port at all.
#
# Secrets come from the file TALENT_ENV_FILE names, /etc/talent/talent.env in production, which is
# root-owned and 0600. A rehearsal on a developer machine points it at ./.env instead.
name: talent

x-image: &image
  image: ${TALENT_IMAGE:-ghcr.io/theaddresstech/talent-platform}:${TALENT_IMAGE_TAG:?set TALENT_IMAGE_TAG, the version to run}
  build: !reset null
  restart: unless-stopped
  env_file: ${TALENT_ENV_FILE:-/etc/talent/talent.env}

services:
  postgres:
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  object-storage:
    restart: unless-stopped
    ports: !reset []

  migrate:
    <<: *image
    restart: "no"

  storage-init:
    <<: *image
    restart: "no"

  api:
    <<: *image
    ports:
      - "127.0.0.1:${TALENT_API_PORT:-8090}:8000"

  worker:
    <<: *image

  event-delivery:
    <<: *image
