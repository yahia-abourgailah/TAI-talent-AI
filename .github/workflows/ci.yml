name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-data:
    name: No candidate data or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block data and credential files
        run: bash scripts/check_no_data.sh

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    needs: guard-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: guard-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  parity:
    name: Golden replay parity
    runs-on: [self-hosted, talent]
    needs: guard-data
    if: contains(github.event.pull_request.changed_files, 'src/scoring') || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Replay every record against the ported scorer
        env:
          TALENT_MASTER_PATH: ${{ secrets.TALENT_MASTER_PATH }}
        run: pytest tests/parity -q --tb=short
      - name: Publish shadow diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-diff
          path: artifacts/shadow_diff.md
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.base_ref == 'staging' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration -q
