name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-data:
    name: No candidate data or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block data and credential files
        run: bash scripts/check_no_data.sh
      - name: Scan full history for secrets
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1 git --redact --verbose .

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    needs: guard-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: guard-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  parity:
    name: Golden replay parity
    runs-on: [self-hosted, talent]
    needs: guard-data
    if: contains(github.event.pull_request.changed_files, 'src/scoring') || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Replay every record against the ported scorer
        env:
          TALENT_MASTER_PATH: ${{ secrets.TALENT_MASTER_PATH }}
        run: pytest tests/parity -q --tb=short
      - name: Publish shadow diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-diff
          path: artifacts/shadow_diff.md
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talent_owner
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: talent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talent_owner -d talent"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: ci-owner
      TALENT_DB_MIGRATION_DSN: postgresql+psycopg://talent_owner:ci-owner@localhost:5432/talent
      TALENT_TEST_OWNER_DSN: postgresql+psycopg://talent_owner:ci-owner@localhost:5432/talent
      TALENT_TEST_APP_DSN: postgresql+psycopg://talent_app:ci-app@localhost:5432/talent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Create database roles
        run: >-
          psql -h localhost -U talent_owner -d talent -v ON_ERROR_STOP=1
          -v app_password=ci-app -f docker/postgres/roles.sql
      - run: alembic upgrade head
      - run: pytest tests/integration -q

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "talent-platform:${GITHUB_SHA}" .
