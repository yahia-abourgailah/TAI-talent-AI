name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-data:
    name: No candidate data or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block data and credential files
        run: bash scripts/check_no_data.sh
      - name: Scan full history for secrets
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1 git --redact --verbose .

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    needs: guard-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: guard-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  changes:
    name: Detect scoring changes
    runs-on: ubuntu-latest
    outputs:
      scoring: ${{ steps.diff.outputs.scoring }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Did this change touch src/scoring?
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          # If the comparison point is unknown (new branch, force push), assume scoring changed.
          if changed=$(git diff --name-only "$base" HEAD -- src/scoring 2>/dev/null); then
            [ -n "$changed" ] && scoring=true || scoring=false
          else
            scoring=true
          fi
          echo "scoring=$scoring" >> "$GITHUB_OUTPUT"

  parity:
    name: Golden replay parity
    needs: [guard-data, changes]
    if: needs.changes.outputs.scoring == 'true'
    # The master record never leaves company machines, so parity runs only on the self-hosted
    # runner. Until it exists, a scoring change fails here loudly instead of queueing forever.
    runs-on: ${{ vars.PARITY_RUNNER_READY == 'true' && fromJSON('["self-hosted", "talent"]') || 'ubuntu-latest' }}
    steps:
      - name: Require the parity runner
        if: vars.PARITY_RUNNER_READY != 'true'
        run: |
          echo "::error::src/scoring changed, but the self-hosted parity runner is not set up. Register a runner labelled 'talent' with access to the master record, then set the repository variable PARITY_RUNNER_READY=true."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Replay every record against the ported scorer
        env:
          TALENT_MASTER_PATH: ${{ secrets.TALENT_MASTER_PATH }}
        # Fails when any difference has no matching ruling in src/replay/rulings.py (BR-702).
        run: >-
          python -m replay.baseline --out "$RUNNER_TEMP/baseline" --run-date 2026-09-14
          --report-copy artifacts/shadow_diff.md --require-parity
      - name: Publish shadow diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-diff
          path: artifacts/shadow_diff.md
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talent_owner
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: talent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talent_owner -d talent"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: ci-owner
      TALENT_DB_MIGRATION_DSN: postgresql+psycopg://talent_owner:ci-owner@localhost:5432/talent
      TALENT_TEST_OWNER_DSN: postgresql+psycopg://talent_owner:ci-owner@localhost:5432/talent
      TALENT_TEST_APP_DSN: postgresql+psycopg://talent_app:ci-app@localhost:5432/talent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Create database roles
        run: >-
          psql -h localhost -U talent_owner -d talent -v ON_ERROR_STOP=1
          -v app_password=ci-app -f docker/postgres/roles.sql
      - run: alembic upgrade head
      - run: pytest tests/integration -q

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "talent-platform:${GITHUB_SHA}" .
