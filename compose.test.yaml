# Loopback-only database access, for running integration tests from the host:
#
#   docker compose -f compose.yaml -f compose.test.yaml up -d --wait postgres
#   docker compose -f compose.yaml -f compose.test.yaml run --rm migrate
#   pytest tests/integration
services:
  postgres:
    ports:
      - "127.0.0.1:${TALENT_TEST_DB_PORT:-55432}:5432"
