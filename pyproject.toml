[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "talent-platform"
version = "0.1.0"
description = "Candidate sourcing, screening and pipeline for The Address Investments - Talent Acquisition"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "redis>=5.2",
  "boto3>=1.35,<2",
  "pyjwt[crypto]>=2.10,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]

# Packages sit directly under src/ so CODEOWNERS paths (/src/scoring/, /src/consent/, ...) match.
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Criteria versions are ported verbatim and never reformatted - see the module header.
extend-exclude = ["src/scoring/rulesets/v2026_08_04.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
  "api", "auth", "candidates", "config", "db", "importer", "infra", "jobs", "pipeline", "replay",
  "scoring",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scoring.rulesets.v2026_08_04"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
